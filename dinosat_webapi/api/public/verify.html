<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/assets/DinoSatLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/styles/verify.css"> 
</head>
<body>
    <div class="verificationPageWrapper">
        <div class="verificationHeaderContainer">
            <div class="verifyHeroBackgroundWrapper">
                <div class="verifyHeroBackground">
                    <div class="verifyBackgroundBlur resetBackgroundBlur1"></div>
                    <div class="verifyBackgroundBlur resetBackgroundBlur2"></div>
                    <div class="verifyBackgroundBlur resetBackgroundBlur3"></div>
                </div>
                <div class="verifyGridPattern"></div>
                <div class="unverifiedEmailCell">
                    <i class="fas fa-envelope unverifiedEmailIcon" style="font-size: 3em;"></i>
                    <div class="unverifiedEmailText">
                        <strong>This token is either expired or invalid.</strong>
                        <p>If you have successfully created account, you can request another verification email below.</p>
                    </div>
                    <input class="unverifiedInputWrapper" type="email" placeholder="Enter your email to resend">
                    <div class="unverifiedEmailButtons">
                        <button class="unverifiedEmailRefresh">
                            <label class="loginInputText">Resend Verification Email</label>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const software = urlParams.get('software') || 'dinosat';
        const resendButton = document.querySelector('.unverifiedEmailRefresh');
        const emailInput = document.querySelector('.unverifiedInputWrapper');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'resendMessage';
        messageDiv.style.color = '#ffffff';
        messageDiv.style.marginTop = '10px';
        document.querySelector('.unverifiedEmailText').appendChild(messageDiv);

        resendButton.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email) {
                messageDiv.textContent = 'Please enter your email.';
                return;
            }
            messageDiv.textContent = 'Sending...';
            try {
                const response = await fetch('/resend-verification-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, software })
                });
                if (response.ok) {
                    messageDiv.textContent = 'Verification email resent. Please check your inbox.';
                } else {
                    const errorData = await response.json();
                    messageDiv.textContent = errorData.message || 'Failed to resend. Please try again.';
                }
            } catch {
                messageDiv.textContent = 'Network error. Please try again.';
            }
        });
    </script>
</body>
</html>
